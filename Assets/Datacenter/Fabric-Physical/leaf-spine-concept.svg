  <path d="M580 100 L610 220" stroke="#6b7280" stroke-width="2"/>
  <text x="40" y="310" font-family="Helvetica,Arial,sans-serif" font-size="12">Every leaf uplinks to every spine. Put spines on diverse power/racks.</text>
  <text x="40" y="330" font-family="Helvetica,Arial,sans-serif" font-size="12">Servers dual-home to a ToR pair (A/B)—not both NICs into one switch.</text>
