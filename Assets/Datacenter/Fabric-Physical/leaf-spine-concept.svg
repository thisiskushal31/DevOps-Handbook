  <text x="240" y="245" font-family="Helvetica,Arial,sans-serif" font-size="12">Leaf/ToR</text>
  <rect x="400" y="220" width="100" height="40" rx="6" fill="#86efac" stroke="#14532d"/>
  <text x="420" y="245" font-family="Helvetica,Arial,sans-serif" font-size="12">Leaf/ToR</text>
  <rect x="560" y="220" width="100" height="40" rx="6" fill="#86efac" stroke="#14532d"/>
  <text x="580" y="245" font-family="Helvetica,Arial,sans-serif" font-size="12">Leaf/ToR</text>
  <path d="M140 100 L110 220" stroke="#374151" stroke-width="2"/>
  <path d="M140 100 L270 220" stroke="#374151" stroke-width="2"/>
  <path d="M140 100 L450 220" stroke="#374151" stroke-width="2"/>
  <path d="M140 100 L610 220" stroke="#374151" stroke-width="2"/>
  <path d="M580 100 L110 220" stroke="#6b7280" stroke-width="2"/>
