<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#f7f5f0"/>
  <text x="20" y="28" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Hall network planes (mental map)</text>
  <rect x="40" y="60" width="180" height="70" rx="8" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="55" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13">Edge / WLAN</text>
  <text x="55" y="110" font-family="Helvetica,Arial,sans-serif" font-size="11">AP → switch → GW</text>
  <rect x="260" y="60" width="180" height="70" rx="8" fill="#dcfce7" stroke="#14532d"/>
  <text x="275" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13">Server LAN</text>
  <text x="275" y="110" font-family="Helvetica,Arial,sans-serif" font-size="11">NIC → ToR → spine</text>
  <rect x="480" y="60" width="180" height="70" rx="8" fill="#fef3c7" stroke="#92400e"/>
  <text x="495" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13">OOB / BMC</text>
  <text x="495" y="110" font-family="Helvetica,Arial,sans-serif" font-size="11">Mgmt switch plane</text>
  <rect x="700" y="60" width="180" height="70" rx="8" fill="#fce7f3" stroke="#9d174d"/>
  <text x="715" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13">Storage fabric</text>
  <text x="715" y="110" font-family="Helvetica,Arial,sans-serif" font-size="11">FC / iSCSI / NVMe-oF</text>
  <rect x="200" y="200" width="520" height="90" rx="8" fill="#e5e7eb" stroke="#374151"/>
  <text x="220" y="240" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">MMR / border</text>
  <text x="220" y="265" font-family="Helvetica,Arial,sans-serif" font-size="12">Carriers, cloud on-ramps, cross-connects — leave the building here</text>
  <path d="M130 130 V180 H460 V200" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M350 130 V180" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M570 130 V180 H460" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M790 130 V180 H720" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="40" y="340" font-family="Helvetica,Arial,sans-serif" font-size="12">Rule: planes share a building, not a failure domain — dual power and dual ToR still apply per plane.</text>
  <text x="40" y="365" font-family="Helvetica,Arial,sans-serif" font-size="12">Colo white space often has no WLAN; lab/office/edge planes still need AP→gateway literacy.</text>
</svg>
