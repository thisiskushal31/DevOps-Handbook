<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f4f1ea"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#111">Whole hall — layers that keep software alive</text>
  <rect x="40" y="60" width="880" height="56" rx="8" fill="#fecaca" stroke="#7f1d1d"/>
  <text x="56" y="85" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">1 Power</text>
  <text x="56" y="105" font-family="Helvetica,Arial,sans-serif" font-size="12">Utility → UPS/generator → row PDU → rack PDU A/B → PSU</text>
  <rect x="40" y="130" width="880" height="56" rx="8" fill="#bfdbfe" stroke="#1e3a8a"/>
  <text x="56" y="155" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">2 Cooling</text>
  <text x="56" y="175" font-family="Helvetica,Arial,sans-serif" font-size="12">Chips heat → CRAH/CRAC → plant (chiller/tower) → outdoors</text>
  <rect x="40" y="200" width="880" height="56" rx="8" fill="#bbf7d0" stroke="#14532d"/>
  <text x="56" y="225" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">3 White space + compute</text>
  <text x="56" y="245" font-family="Helvetica,Arial,sans-serif" font-size="12">Racks/U → servers/DIMM/CPU/GPU → BMC</text>
  <rect x="40" y="270" width="880" height="56" rx="8" fill="#fde68a" stroke="#92400e"/>
  <text x="56" y="295" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">4 Network + storage planes</text>
  <text x="56" y="315" font-family="Helvetica,Arial,sans-serif" font-size="12">LAN / OOB / storage fabric / MMR border — see Setup hall map</text>
  <rect x="40" y="340" width="880" height="56" rx="8" fill="#e9d5ff" stroke="#6b21a8"/>
  <text x="56" y="365" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700">5 People + screens</text>
  <text x="56" y="385" font-family="Helvetica,Arial,sans-serif" font-size="12">EPMS/BMS/DCIM → reports → steer · tickets · roles</text>
  <rect x="40" y="410" width="880" height="70" rx="8" fill="#e5e7eb" stroke="#374151"/>
  <text x="56" y="440" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">How to climb</text>
  <text x="56" y="462" font-family="Helvetica,Arial,sans-serif" font-size="12">Learn layers 1–2 (Facility/Electrical/Mechanical) · build with Setup-And-Bring-Up · deepen Fabric/Compute/Storage · operate via Jobs + Integration</text>
</svg>
