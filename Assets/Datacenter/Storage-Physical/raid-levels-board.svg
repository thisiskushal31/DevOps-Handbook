<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <rect width="800" height="320" fill="#f7f5f0"/>
  <text x="20" y="28" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700">RAID levels (setup literacy)</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12">
    <rect x="30" y="50" width="140" height="100" rx="6" fill="#fee2e2" stroke="#991b1b"/>
    <text x="45" y="75" font-weight="700">RAID 0</text>
    <text x="45" y="95">Stripe, no parity</text>
    <text x="45" y="115">Speed; zero safety</text>
    <rect x="190" y="50" width="140" height="100" rx="6" fill="#dcfce7" stroke="#14532d"/>
    <text x="205" y="75" font-weight="700">RAID 1</text>
    <text x="205" y="95">Mirror</text>
    <text x="205" y="115">OS disks common</text>
    <rect x="350" y="50" width="140" height="100" rx="6" fill="#e0e7ff" stroke="#3730a3"/>
    <text x="365" y="75" font-weight="700">RAID 5</text>
    <text x="365" y="95">Stripe + parity</text>
    <text x="365" y="115">1 disk fault</text>
    <rect x="510" y="50" width="140" height="100" rx="6" fill="#fef3c7" stroke="#92400e"/>
    <text x="525" y="75" font-weight="700">RAID 6</text>
    <text x="525" y="95">Dual parity</text>
    <text x="525" y="115">2 disk fault</text>
    <rect x="670" y="50" width="110" height="100" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="682" y="75" font-weight="700">RAID 10</text>
    <text x="682" y="95">Mirror+stripe</text>
    <text x="682" y="115">Perf + safety</text>
  </g>
  <text x="30" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13">Clusters (Ceph/vSAN): often JBOD + software — avoid hardware RAID under SDS.</text>
  <text x="30" y="225" font-family="Helvetica,Arial,sans-serif" font-size="13">Always document: controller battery/cache policy, hot-spare, rebuild priority.</text>
</svg>
