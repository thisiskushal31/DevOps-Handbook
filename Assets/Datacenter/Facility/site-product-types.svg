<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <rect width="900" height="260" fill="#fafaf9"/>
  <text x="16" y="28" font-family="Helvetica" font-size="16" font-weight="700">Site / product shapes (literacy)</text>
  <g font-family="Helvetica" font-size="12">
    <rect x="30" y="60" width="150" height="120" rx="8" fill="#dbeafe" stroke="#1e3a8a"/><text x="50" y="100" font-weight="700">Owned DC</text><text x="45" y="125">You own plant</text><text x="45" y="145">+ iron</text>
    <rect x="200" y="60" width="150" height="120" rx="8" fill="#dcfce7" stroke="#14532d"/><text x="230" y="100" font-weight="700">Colo</text><text x="215" y="125">Landlord plant</text><text x="215" y="145">Your iron/cage</text>
    <rect x="370" y="60" width="150" height="120" rx="8" fill="#fef3c7" stroke="#92400e"/><text x="395" y="100" font-weight="700">Wholesale</text><text x="385" y="125">Large suites</text><text x="385" y="145">Hyperscale-ish</text>
